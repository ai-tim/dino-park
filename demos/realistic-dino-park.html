<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Кастомный мир</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div>
            <h3 style="margin: 0 0 4px 0;">Парк Динозавров</h3>
            <p style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Авторский мир ручной сборки</p>
        </div>
        <a href="control-panel.html" class="back-btn">Панель</a>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                document.getElementById('webcam-video').srcObject = stream;
            } catch (e) {
                console.log('Камера недоступна');
            }
        }
        initCamera();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        dirLight.position.set(10, 25, 10);
        scene.add(dirLight);

        // Главная группа парка
        const parkGroup = new THREE.Group();

        // Функция создания Хищника (T-Rex стиль из геометрических модулей)
        function createTRex() {
            const trex = new THREE.Group();
            
            // Тело
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.5, 2.5),
                new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.4 })
            );
            body.position.set(0, 0, 0);
            trex.add(body);

            // Голова
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.4 })
            );
            head.position.set(0, 1.1, 1.1);
            trex.add(head);

            // Хвост
            const tail = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.6, 2),
                new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.4 })
            );
            tail.position.set(0, 0.2, -1.8);
            trex.add(tail);

            trex.position.set(-3, 0, 0);
            return trex;
        }

        // Функция создания Травоядного (Трицератопс стиль)
        function createTriceratops() {
            const triceratops = new THREE.Group();

            // Тело
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 1.4, 2.8),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.4 })
            );
            body.position.set(0, 0, 0);
            triceratops.add(body);

            // Голова с воротником
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.0, 1.0),
                new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.4 })
            );
            head.position.set(0, 0.4, 1.5);
            triceratops.add(head);

            triceratops.position.set(3, 0, 0);
            return triceratops;
        }

        const tRexInstance = createTRex();
        const triceratopsInstance = createTriceratops();

        parkGroup.add(tRexInstance);
        parkGroup.add(triceratopsInstance);
        scene.add(parkGroup);

        function animate() {
            requestAnimationFrame(animate);
            parkGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
