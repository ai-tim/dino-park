<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Park - 3D Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <h2>Парк Динозавров</h2>
        <p>Интерактивная 3D-сцена (Three.js)</p>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Подключаем Three.js из локальной папки vendor -->
    <script src="../vendor/three.min.js"></script>
    <script>
        // Инициализация базовой 3D-сцены парка
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Добавляем освещение в доисторический мир
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Временный объект-заглушка для демонстрации рендеринга (позже здесь будет модель T-Rex)
        const geometry = new THREE.BoxGeometry(3, 2, 5);
        const material = new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.4 });
        const dinoPlaceholder = new THREE.Mesh(geometry, material);
        dinoPlaceholder.position.set(0, 0, 0);
        scene.add(dinoPlaceholder);

        // Анимационный цикл
        function animate() {
            requestAnimationFrame(animate);
            
            // Легкое вращение для демонстрации
            dinoPlaceholder.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация под изменение размера экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
