<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Главное меню</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #f59e0b;
        }
        p {
            margin: 0 0 25px 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .menu-btn {
            display: block;
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .menu-btn:hover {
            background: #15803d;
        }
        .menu-btn.secondary {
            background: #334155;
        }
        .menu-btn.secondary:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <h1>Парк Динозавров</h1>
        <p>Авторский интерактивный мир с полным экосистемным шоу и камерой</p>
        
        <a href="demos/realistic-dino-park.html" class="menu-btn">🦖 Войти в парк (AR)</a>
        <a href="demos/control-panel.html" class="menu-btn secondary">⚙️ Панель управления</a>
    </div>
</body>
</html>
