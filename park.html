<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b2a2e">
  <title>Динопарк — мой парк</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
  <canvas id="park" class="park-canvas" aria-label="Динопарк"></canvas>
  <div id="hint" class="hint glass">👆 Нажми на парк, чтобы открыть меню</div>

  <div id="overlay" class="overlay closed"><div class="panel glass" id="panel" role="dialog" aria-modal="true"></div></div>

  <div id="camera" class="camera hidden">
    <video id="video" playsinline autoplay muted></video>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="top">
      <button class="back-btn" id="cam-back">← НАЗАД</button>
      <label class="btn" style="min-height:44px">📁 Загрузить фото
        <input type="file" id="cam-file" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <div class="tip glass" id="cam-tip">Наведи камеру на лист так, чтобы все 4 чёрных квадрата попали в рамку</div>
    <div class="bottom"><button class="shutter" id="cam-shot" title="Сфотографировать">📸</button></div>
  </div>
  <input type="file" id="photo-file" accept="image/*" capture="environment" hidden>
  <input type="file" id="bg-file" accept="image/*" hidden>

  <script src="js/boot.js" data-modern='["js/vendor/qrcode.js", "js/util.js", "js/music.js", "js/store.js", "js/needs.js", "js/voices.js", "js/dinos.js", "js/template.js", "js/backgrounds.js", "js/scene.js", "js/life.js", "js/creatures.js", "js/vendor/three.dino.min.js", "js/dino3d.js", "js/nature3d.js", "js/things3d.js", "js/scene3d.js", "js/photo.js", "js/config.js", "js/relay.js", "js/sync.js", "js/ui.js", "js/park.js"]' data-legacy='["js/legacy/polyfills.js", "js/legacy/park-1.js", "js/config.js", "js/legacy/park-2.js"]' data-css-legacy="css/legacy/style.css"></script>
</body>
</html>
