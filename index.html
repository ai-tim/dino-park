<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Живая Экосистема</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Интерфейс главного меню поверх живой сцены */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 40px 20px; pointer-events: none;
        }

        .hero-banner {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 20px 36px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); pointer-events: auto;
            max-width: 600px; width: 100%;
        }
        .hero-banner h1 { margin: 0 0 8px 0; font-size: 2rem; color: #0f172a; font-weight: 800; }
        .hero-banner p { margin: 0; color: #475569; font-size: 1rem; }

        .menu-buttons-panel {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 24px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; gap: 14px;
            width: 100%; max-width: 400px; pointer-events: auto;
        }
        .menu-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px 20px; border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 1.05rem;
            color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.12); transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: none; cursor: pointer; text-align: center;
        }
        .menu-btn:active { transform: scale(0.97); }
        .menu-btn.primary { background: linear-gradient(135deg, #10b981, #059669); }
        .menu-btn.scanner { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .menu-btn.tv { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

        .footer-note {
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
            color: #f8fafc; padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="menu-overlay">
        <div class="hero-banner">
            <h1>🦕 Парк Динозавров</h1>
            <p>Живая экосистема, свободный мир природы и оживление детских рисунков</p>
        </div>

        <div class="menu-buttons-panel">
            <a href="demos/realistic-dino-park.html" class="menu-btn primary">🌴 Войти в Парк (Природа)</a>
            <a href="demos/scanner.html" class="menu-btn scanner">🎨 Оживить динозавра (Сканер)</a>
            <a href="demos/realistic-dino-park.html?tv=1" class="menu-btn tv">📺 Режим для ТВ (Трансляция)</a>
        </div>

        <div class="footer-note">
            ✨ Нажмите на любую кнопку, чтобы исследовать мир
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация солнечной 3D-сцены главного меню
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb1e1ff); // Ясное голубое небо
        scene.fog = new THREE.FogExp2(0xb1e1ff, 0.015); // Легкая светлая дымка

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 8, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Освещение теплого солнечного дня
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
        sunLight.position.set(20, 30, 20);
        scene.add(sunLight);

        // Светлая зеленая земля (поляна)
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        scene.add(ground);

        // Создаем детализированных бродящих динозавров для главного меню
        function createRoamingDino(colorHex, startX, startZ) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            
            // Тело
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 3.8), bodyMat);
            body.position.y = 0.9;
            group.add(body);

            // Голова
            const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1.2), bodyMat);
            head.position.set(0, 1.8, 2.2);
            group.add(head);

            // Хвост
            const tail = new THREE.Mesh(new THREE.ConeGeometry(0.6, 3, 4), bodyMat);
            tail.rotation.x = Math.PI / 2;
            tail.position.set(0, 1, -3);
            group.add(tail);

            // Ноги
            const legGeo = new THREE.BoxGeometry(0.5, 1.6, 0.5);
            ['FL', 'FR', 'BL', 'BR'].forEach((pos, idx) => {
                const leg = new THREE.Mesh(legGeo, bodyMat);
                leg.position.set((idx % 2 === 0 ? 0.9 : -0.9), 0, (idx < 2 ? 1.2 : -1.2));
                group.add(leg);
            });

            group.position.set(startX, -2, startZ);
            scene.add(group);

            return {
                mesh: group,
                angle: Math.random() * Math.PI * 2,
                speed: 0.02 + Math.random() * 0.015,
                radius: 8 + Math.random() * 6
            };
        }

        const roamingDinosaurs = [
            createRoamingDino(0x10b981, -6, -4), // Зеленый
            createRoamingDino(0xf59e0b, 6, -8),  // Желтый
            createRoamingDino(0xec4899, -8, 4)   // Розовый
        ];

        // Анимация хаотичного движения динозавров на фоне
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            roamingDinosaurs.forEach((dino, idx) => {
                dino.angle += dino.speed * 0.5;
                const targetX = Math.cos(dino.angle) * dino.radius;
                const targetZ = Math.sin(dino.angle) * dino.radius - 5;
                
                // Плавный поворот и движение
                const dx = targetX - dino.mesh.position.x;
                const dz = targetZ - dino.mesh.position.z;
                if (Math.abs(dx) > 0.1 || Math.abs(dz) > 0.1) {
                    dino.mesh.rotation.y = Math.atan2(dx, dz);
                }
                
                dino.mesh.position.x += dx * 0.02;
                dino.mesh.position.z += dz * 0.02;

                // Живое покачивание при ходьбе
                dino.mesh.position.y = -2 + Math.sin(time * 6 + idx) * 0.15;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
