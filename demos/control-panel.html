<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Управление миром</title>
    <link rel="stylesheet" href="../assets/ui.css">
    <style>
        body { padding: 20px; }
        .panel-container { max-width: 500px; margin: 0 auto; }
        .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-feed-meat { background: #C62828; }
        .btn-feed-meat:hover { background: #D32F2F; }
        .btn-feed-plant { background: #EF6C00; }
        .btn-feed-plant:hover { background: #F57C00; }
        select {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="panel-container">
        <h2>🎮 Управление Парком</h2>

        <!-- Секция запуска динозавров -->
        <div class="section">
            <h3>Оживить динозавра</h3>
            <button class="btn" onclick="openScanner()">📸 Сфотографировать раскраску</button>
            <button class="btn" onclick="spawnPresetDino()">🦖 Запустить случайного обитателя</button>
        </div>

        <!-- Секция кормления (разделение по типам еды) -->
        <div class="section">
            <h3>Покормить обитателей</h3>
            <button class="btn btn-feed-meat" onclick="feedDinos('meat')">🥩 Бросить мясо (для Тираннозавра и Велоцираптора)</button>
            <button class="btn btn-feed-plant" onclick="feedDinos('plants')">🌿 Бросить папоротник (для Трицератопса и Брахиозавра)</button>
        </div>

        <!-- Секция смены фонов -->
        <div class="section">
            <h3>Доисторический пейзаж</h3>
            <select id="bgSelect" onchange="changeBackground()">
                <option value="volcanoes">🌋 Вулканическая долина</option>
                <option value="jungle">🌴 Густые доисторические джунгли</option>
                <option value="canyon">🏜️ Каменистый каньон</option>
            </select>
        </div>
    </div>

    <script>
        function openScanner() {
            alert('Переход к модулю сканирования раскраски динозавра.');
        }

        function spawnPresetDino() {
            alert('Новый динозавр успешно выпущен в доисторический мир!');
        }

        function feedDinos(type) {
            if (type === 'meat') {
                alert('Хищники сбежались на запах мяса!');
            } else {
                alert('Травоядные с аппетитом принялись за сочные папоротники!');
            }
        }

        function changeBackground() {
            const selectedBg = document.getElementById('bgSelect').value;
            console.log('Пейзаж парка изменен на:', selectedBg);
        }
    </script>
</body>
</html>
