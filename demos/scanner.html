<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканирование раскраски — Парк Динозавров</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .header { padding: 20px; text-align: center; z-index: 10; }
        .header h1 { font-size: 1.4rem; color: #4ade80; margin: 0 0 6px 0; }
        .header p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
        .camera-container {
            position: relative; width: 90%; max-width: 400px; height: 60vh;
            background: #1e293b; border-radius: 24px; overflow: hidden;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .scan-frame {
            position: absolute; width: 80%; height: 70%;
            border: 2px solid #4ade80; border-radius: 16px;
            box-shadow: 0 0 0 1000px rgba(9, 13, 22, 0.6);
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .scan-frame span {
            color: #4ade80; font-size: 0.85rem; font-weight: bold; background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px; border-radius: 8px; position: absolute; bottom: 12px;
        }
        .footer-panel { padding: 24px; width: 100%; max-width: 420px; display: flex; gap: 12px; z-index: 10; }
        .btn {
            flex: 1; padding: 14px; border-radius: 14px; font-weight: bold; font-size: 0.95rem;
            cursor: pointer; text-align: center; border: none; text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.96); }
        .btn.scan { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
        .btn.back { background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📷 Сканер раскраски</h1>
        <p>Наведите камеру на рисунок в рамку</p>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-frame">
            <span>Поместите рисунок сюда</span>
        </div>
    </div>

    <div class="footer-panel">
        <a href="../index.html" class="btn back">Назад</a>
        <button class="btn scan" onclick="captureAndProcess()">Выпустить в парк</button>
    </div>

    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => {
                console.log("Камера недоступна: ", err);
            });

        function captureAndProcess() {
            // Генерируем случайный красивый HEX-цвет нового динозавра
            const colors = ['ff5733', '33ff57', '3357ff', 'f3ff33', 'ff33f3', '33fff3'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Переходим в парк и передаем цвет нового динозавра через параметры ссылки
            window.location.href = `realistic-dino-park.html?newDino=${randomColor}`;
        }
    </script>
</body>
</html>
