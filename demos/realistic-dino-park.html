<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — 3D Экосистема</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090d16;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }
        /* Гарантированное отображение холста на заднем плане */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Верхняя панель */
        .top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .park-title-badge {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-decoration: none;
            color: white;
        }
        .panel-link-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
            border: none;
            cursor: pointer;
        }
        /* Нижняя панель кормления */
        .park-ui-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 18px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 12px;
            z-index: 100;
            width: 92%;
            max-width: 420px;
        }
        .park-ui-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 14px 12px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .park-ui-btn.meat {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }
        .park-ui-btn.plant {
            background: linear-gradient(135deg, #10b981, #047857);
        }
        .tv-mode-hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="top-bar" id="topBar">
        <a href="../index.html" class="park-title-badge">🦖 Парк Динозавров</a>
        <a href="control-panel.html" class="panel-link-btn">Панель</a>
    </div>

    <div id="canvas-container"></div>

    <div class="park-ui-panel" id="uiPanel">
        <button class="park-ui-btn meat" onclick="alert('Хищники сбежались на запах мяса!')">🥩 Бросить мясо</button>
        <button class="park-ui-btn plant" onclick="alert('Травоядные с аппетитом принялись за папоротники!')">🌿 Бросить папоротник</button>
    </div>

    <!-- Подключаем Three.js из vendor -->
    <script src="../vendor/three.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('tv') || urlParams.has('embed')) {
            document.getElementById('topBar').classList.add('tv-mode-hidden');
            document.getElementById('uiPanel').classList.add('tv-mode-hidden');
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090d16);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Яркие 3D элементы динозавров
        const geometry = new THREE.BoxGeometry(2, 2, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.2 });
        const dino = new THREE.Mesh(geometry, material);
        scene.add(dino);

        const dino2Geo = new THREE.BoxGeometry(1.5, 1.5, 3);
        const dino2Mat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.2 });
        const dino2 = new THREE.Mesh(dino2Geo, dino2Mat);
        dino2.position.set(3, -0.5, -2);
        scene.add(dino2);

        function animate() {
            requestAnimationFrame(animate);
            dino.rotation.y += 0.012;
            dino2.rotation.y -= 0.018;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
