<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Главное меню</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #090d16, #1e293b);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container {
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: #22c55e;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        p {
            margin: 0 0 20px 0;
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .menu-btn {
            display: block;
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
            transition: transform 0.1s;
        }
        .menu-btn:active {
            transform: scale(0.98);
        }
        .menu-btn.scanner {
            background: #3b82f6;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        .menu-btn.secondary {
            background: #475569;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <h1>🦖 Парк Динозавров</h1>
        <p>Раскрась рисунок на листе, сфотографируй его телефоном — и динозавр оживет в 3D на большом экране!</p>
        
        <a href="demos/realistic-dino-park.html" class="menu-btn">Открыть парк в 3D (AR)</a>
        <a href="#" class="menu-btn scanner" onclick="alert('Функция сканера раскраски активна'); return false;">Скачать раскраску T-Rex</a>
        <a href="demos/control-panel.html" class="menu-btn secondary">Панель управления</a>
    </div>
</body>
</html>
