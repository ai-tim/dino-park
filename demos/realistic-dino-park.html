<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — 30 Уникальных Трюков</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .feed-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .feed-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .feed-btn.meat {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div>
            <h3 style="margin: 0 0 4px 0;">Парк Динозавров</h3>
            <p id="action-status" style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Мега-шоу из 30 трюков готово</p>
        </div>
        <a href="control-panel.html" class="back-btn">Панель</a>
    </div>

    <div class="feed-panel">
        <button class="feed-btn meat" onclick="feedDinos('meat')">🥩 Бросить мясо</button>
        <button class="feed-btn" onclick="feedDinos('plants')">🌿 Бросить папоротник</button>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                document.getElementById('webcam-video').srcObject = stream;
            } catch (e) {
                console.log('Камера недоступна');
            }
        }
        initCamera();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        dirLight.position.set(10, 25, 10);
        scene.add(dirLight);

        const parkGroup = new THREE.Group();

        function createTRex() {
            const trex = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, 2.2), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 }));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 1.0), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.3 }));
            head.position.set(0, 0.9, 1.0);
            const crest = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }));
            crest.position.set(0, 0.8, -0.2);
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 2.0), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.3 }));
            tail.position.set(0, 0.2, -1.7);
            trex.add(body, head, crest, tail);
            trex.position.set(-4, 0, 0);
            return trex;
        }

        function createTriceratops() {
            const triceratops = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.4), new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.3 }));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.9), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.3 }));
            head.position.set(0, 0.3, 1.3);
            const shield = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 0.2), new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.3 }));
            shield.position.set(0, 0.5, 0.9);
            triceratops.add(body, head, shield);
            triceratops.position.set(-1.3, 0, 0);
            return triceratops;
        }

        function createPterodactyl() {
            const pterodactyl = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 1.4), new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.3 }));
            const wing1 = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3 }));
            wing1.position.set(-1.2, 0.1, 0);
            wing1.name = 'leftWing';
            const wing2 = wing1.clone();
            wing2.position.x = 1.2;
            wing2.name = 'rightWing';
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), new THREE.MeshStandardMaterial({ color: 0x7e22ce, roughness: 0.3 }));
            head.position.set(0, 0.3, 0.9);
            pterodactyl.add(body, wing1, wing2, head);
            pterodactyl.position.set(1.5, 2.5, 0);
            return pterodactyl;
        }

        function createBrachiosaurus() {
            const brachiosaurus = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2.8), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 }));
            const neck = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.3 }));
            neck.position.set(0, 1.5, 1.0);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.3 }));
            head.position.set(0, 2.8, 1.2);
            brachiosaurus.add(body, neck, head);
            brachiosaurus.position.set(4, -0.2, 0);
            return brachiosaurus;
        }

        const tRex = createTRex();
        const triceratops = createTriceratops();
        const pterodactyl = createPterodactyl();
        const brachiosaurus = createBrachiosaurus();

        parkGroup.add(tRex, triceratops, pterodactyl, brachiosaurus);
        scene.add(parkGroup);

        let activeGroup = [];
        let activeBird = null;
        let trickTimer = 0;
        let currentTrick = 0;
        let originalYPos = { tRex: tRex.position.y, tri: triceratops.position.y, bra: brachiosaurus.position.y, bird: pterodactyl.position.y };
        let originalXPos = { tRex: tRex.position.x, tri: triceratops.position.x, bra: brachiosaurus.position.x };

        window.feedDinos = function(type) {
            const status = document.getElementById('action-status');
            currentTrick = Math.floor(Math.random() * 30) + 1; // Случайный трюк от 1 до 30

            if (type === 'meat') {
                status.innerText = `🥩 Мега-шоу хищников: Трюк #${currentTrick}!`;
                activeGroup = [tRex];
                activeBird = pterodactyl;
            } else {
                status.innerText = `🌿 Мега-шоу травоядных: Трюк #${currentTrick}!`;
                activeGroup = [triceratops, brachiosaurus];
                activeBird = null;
            }
            trickTimer = 80;
        };

        function animate() {
            requestAnimationFrame(animate);
            parkGroup.rotation.y += 0.004;

            if (trickTimer > 0 && activeGroup.length > 0) {
                activeGroup.forEach((dino) => {
                    const baseName = dino === tRex ? 'tRex' : (dino === triceratops ? 'tri' : 'bra');

                    switch(currentTrick) {
                        case 1: dino.rotation.z = Math.sin(trickTimer * 0.5) * 0.2; break;
                        case 2: dino.rotation.x = -0.4; dino.position.y = originalYPos[baseName] + 0.4; break;
                        case 3: dino.position.y = originalYPos[baseName] + Math.abs(Math.sin(trickTimer * 0.4)) * 0.9; break;
                        case 4: dino.rotation.y += 0.2; break;
                        case 5: dino.rotation.x = 0.4; break;
                        case 6: dino.position.x = originalXPos[baseName] + Math.sin(trickTimer * 0.3) * 0.8; break;
                        case 7: { let s = 1 + Math.sin(trickTimer * 0.5) * 0.25; dino.scale.set(s, s, s); break; }
                        case 8: dino.position.x = originalXPos[baseName] + Math.cos(trickTimer * 0.4) * 0.6; break;
                        case 9: dino.rotation.y -= 0.25; break;
                        case 10: dino.rotation.x = -0.3; dino.rotation.z = 0.2; break;
                        case 11: dino.position.y = originalYPos[baseName] + Math.sin(trickTimer * 0.6) * 0.5; break;
                        case 12: dino.rotation.z = -0.3; break;
                        case 13: dino.rotation.z = 0.3; break;
                        case 14: dino.position.z = Math.sin(trickTimer * 0.5) * 0.7; break;
                        case 15: dino.position.y = originalYPos[baseName] + 0.6; dino.rotation.x = -0.2; break;
                        // Новые трюки с 16 по 30
                        case 16: dino.rotation.z = Math.cos(trickTimer * 0.7) * 0.4; break;
                        case 17: dino.rotation.x = Math.sin(trickTimer * 0.4) * 0.3; break;
                        case 18: dino.position.y = originalYPos[baseName] + Math.abs(Math.cos(trickTimer * 0.5)) * 1.1; break;
                        case 19: dino.rotation.y += 0.35; break;
                        case 20: dino.position.x = originalXPos[baseName] - Math.sin(trickTimer * 0.4) * 0.9; break;
                        case 21: { let s = 1 + Math.cos(trickTimer * 0.6) * 0.3; dino.scale.set(s, s, s); break; }
                        case 22: dino.rotation.z = -0.5; dino.position.y = originalYPos[baseName] + 0.3; break;
                        case 23: dino.rotation.z = 0.5; dino.position.y = originalYPos[baseName] + 0.3; break;
                        case 24: dino.position.z = -Math.sin(trickTimer * 0.4) * 0.8; break;
                        case 25: dino.rotation.x = 0.5; dino.position.y = originalYPos[baseName] - 0.2; break;
                        case 26: dino.rotation.y -= 0.4; break;
                        case 27: dino.position.y = originalYPos[baseName] + Math.sin(trickTimer * 0.8) * 0.4; break;
                        case 28: dino.rotation.z = Math.sin(trickTimer * 0.3) * 0.6; break;
                        case 29: dino.position.x = originalXPos[baseName] + Math.sin(trickTimer * 0.5) * 1.2; break;
                        case 30: dino.rotation.x = -0.6; dino.rotation.y += 0.2; break;
                    }
                });

                if (activeBird) {
                    const lWing = activeBird.getObjectByName('leftWing');
                    const rWing = activeBird.getObjectByName('rightWing');

                    switch(currentTrick) {
                        case 1: if (lWing && rWing) { lWing.rotation.z = Math.sin(trickTimer * 0.9) * 0.6; rWing.rotation.z = -Math.sin(trickTimer * 0.9) * 0.6; } break;
                        case 2: activeBird.position.y = originalYPos.bird - Math.sin(trickTimer * 0.1) * 1.8; break;
                        case 3: activeBird.rotation.z += 0.3; break;
                        case 4: activeBird.position.x += Math.sin(trickTimer * 0.4) * 0.08; break;
                        case 5: activeBird.rotation.y += 0.25; activeBird.position.y = originalYPos.bird + Math.sin(trickTimer * 0.3) * 1.2; break;
                        case 6: activeBird.position.y = originalYPos.bird + (80 - trickTimer) * 0.04; break;
                        case 7: activeBird.rotation.x = Math.sin(trickTimer * 0.5) * 0.4; break;
                        case 8: activeBird.rotation.z -= 0.35; break;
                        case 9: activeBird.position.x += 0.05; activeBird.rotation.z = 0.4; break;
                        case 10: activeBird.position.x -= 0.05; activeBird.rotation.z = -0.4; break;
                        case 11: activeBird.position.y = originalYPos.bird + Math.sin(trickTimer * 0.2) * 1.5; break;
                        case 12: if (lWing && rWing) { lWing.rotation.z = Math.sin(trickTimer * 1.5) * 0.8; } break;
                        case 13: activeBird.rotation.y += 0.15; break;
                        case 14: activeBird.position.y = originalYPos.bird - 1.0; break;
                        case 15: activeBird.rotation.z += 0.5; activeBird.position.y = originalYPos.bird + 0.8; break;
                        // Новые воздушные маневры с 16 по 30
                        case 16: activeBird.rotation.x -= 0.3; activeBird.position.y -= 0.05; break;
                        case 17: activeBird.rotation.z += 0.4; activeBird.position.x -= 0.06; break;
                        case 18: activeBird.position.y = originalYPos.bird + Math.cos(trickTimer * 0.3) * 1.6; break;
                        case 19: activeBird.rotation.y -= 0.3; break;
                        case 20: if (lWing && rWing) { lWing.rotation.z = 0.7; rWing.rotation.z = -0.7; } break;
                        case 21: activeBird.position.x += Math.cos(trickTimer * 0.5) * 0.1; break;
                        case 22: activeBird.rotation.z -= 0.6; activeBird.position.y += 0.5; break;
                        case 23: activeBird.rotation.x += 0.4; activeBird.position.y = originalYPos.bird + 1.2; break;
                        case 24: activeBird.position.y = originalYPos.bird - Math.cos(trickTimer * 0.2) * 1.4; break;
                        case 25: activeBird.rotation.y += 0.4; activeBird.rotation.z += 0.2; break;
                        case 26: activeBird.position.x -= 0.08; activeBird.position.y = originalYPos.bird + 0.9; break;
                        case 27: if (lWing && rWing) { lWing.rotation.z = Math.sin(trickTimer * 2.0) * 0.9; } break;
                        case 28: activeBird.rotation.z += 0.8; activeBird.position.y -= 0.8; break;
                        case 29: activeBird.position.y = originalYPos.bird + Math.sin(trickTimer * 0.4) * 2.0; break;
                        case 30: activeBird.rotation.x -= 0.5; activeBird.rotation.y += 0.3; activeBird.position.y = originalYPos.bird + 1.5; break;
                    }
                }

                trickTimer--;
            } else if (activeGroup.length > 0 || activeBird) {
                [tRex, triceratops, brachiosaurus].forEach(d => {
                    d.rotation.set(0, 0, 0);
                    d.position.y = 0;
                    d.position.z = 0;
                    d.scale.set(1, 1, 1);
                });
                tRex.position.x = originalXPos.tRex;
                triceratops.position.x = originalXPos.tri;
                brachiosaurus.position.x = originalXPos.bra;

                pterodactyl.rotation.set(0, 0, 0);
                pterodactyl.position.y = originalYPos.bird;
                activeGroup = [];
                activeBird = null;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
