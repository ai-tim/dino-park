<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный сканер раскрасок — Парк Динозавров</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .header { padding: 20px; text-align: center; z-index: 10; }
        .header h1 { font-size: 1.4rem; color: #4ade80; margin: 0 0 6px 0; }
        .header p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
        .camera-container {
            position: relative; width: 90%; max-width: 400px; height: 60vh;
            background: #1e293b; border-radius: 24px; overflow: hidden;
            border: 2px solid #4ade80;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .scan-frame {
            position: absolute; width: 75%; height: 65%;
            border: 2px dashed #4ade80; border-radius: 16px;
            box-shadow: 0 0 0 1000px rgba(9, 13, 22, 0.65);
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .scan-frame span {
            color: #4ade80; font-size: 0.85rem; font-weight: bold; background: rgba(15, 23, 42, 0.85);
            padding: 6px 12px; border-radius: 8px; position: absolute; bottom: 12px;
        }
        .footer-panel { padding: 24px; width: 100%; max-width: 420px; display: flex; gap: 12px; z-index: 10; }
        .btn {
            flex: 1; padding: 14px; border-radius: 14px; font-weight: bold; font-size: 0.95rem;
            cursor: pointer; text-align: center; border: none; text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.96); }
        .btn.scan { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
        .btn.back { background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📷 Умный сканер</h1>
        <p>Наведите рамку на раскрашенный рисунок</p>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <!-- Скрытый холст для анализа изображения с камеры -->
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="scan-frame">
            <span>Сканирование цвета рисунка...</span>
        </div>
    </div>

    <div class="footer-panel">
        <a href="../index.html" class="btn back">Назад</a>
        <button class="btn scan" onclick="scanDrawing()">Оживить в парке!</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.log("Ошибка камеры: ", err); });

        function scanDrawing() {
            // Устанавливаем размеры холста равными потоку камеры
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Берем образец цвета из центральной зоны кадра (где находится раскраска)
            const centerX = Math.floor(canvas.width / 2);
            const centerY = Math.floor(canvas.height / 2);
            const pixel = ctx.getImageData(centerX, centerY, 1, 1).data;

            // Преобразуем RGB в HEX для передачи в 3D-парк
            const hexColor = ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);

            // Перенаправляем в парк с реальным цветом с бумажного рисунка
            window.location.href = `realistic-dino-park.html?newDino=${hexColor}`;
        }
    </script>
</body>
</html>
