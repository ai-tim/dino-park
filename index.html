<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Главное меню</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container {
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .dino-emblem {
            font-size: 3.2rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(34, 197, 94, 0.4));
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }
        p {
            margin: 0 0 24px 0;
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .menu-btn.coloring {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
        .menu-btn.secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        .footer-info {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="dino-emblem">🦖</div>
        <h1>Парк Динозавров</h1>
        <p>Раскрась рисунок на листе, сфотографируй телефоном — и доисторический мир оживет в 3D!</p>
        
        <a href="./demos/realistic-dino-park.html" class="menu-btn">
            <span>🚀</span> Открыть парк в 3D (AR)
        </a>
        <a href="#" class="menu-btn coloring" onclick="alert('Модуль шаблонов раскраски динозавров'); return false;">
            <span>🎨</span> Скачать раскраску T-Rex
        </a>
        <a href="./demos/control-panel.html" class="menu-btn secondary">
            <span>⚙️</span> Панель управления
        </a>
        
        <div class="footer-info">Интерактивный мир на GitHub Pages</div>
    </div>
</body>
</html>
