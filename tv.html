<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06161a">
  <title>Динопарк — экран телевизора</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* ES5-загрузчик (без let/=>/классов — работает даже в самых старых браузерах ТВ). Ловит ошибки и вместо пустого экрана
       показывает понятное сообщение; журнал ошибок — в localStorage «dp.errors» и window.DPBOOT.errors. */
    (function () {
      var W = window, B = W.DPBOOT = { errors: [], ready: false, t0: new Date().getTime(), mode: '' };
      function txt(e) { return e ? (e.message || String(e)) + (e.stack ? '' : '') : 'неизвестная ошибка'; }
      B.log = function (e, where) {
        var rec = { t: new Date().toISOString ? new Date().toISOString() : String(new Date()), m: txt(e), w: where || '', ua: navigator.userAgent, mode: B.mode };
        B.errors.push(rec);
        try { var L = JSON.parse(localStorage.getItem('dp.errors') || '[]'); L.push(rec); localStorage.setItem('dp.errors', JSON.stringify(L.slice(-15))); } catch (x) { /* нет хранилища */ }
        try { console.error('[Динопарк]', rec.m, rec.w); } catch (x) { /* нет консоли */ }
        return rec;
      };
      B.fail = function (e, where, hint) {
        var rec = B._now ? B.errors[B.errors.length - 1] || B.log(e, where) : B.log(e, where);
        if (B.ready && !hint) return; // экран уже работает — не закрываем его из-за мелкой ошибки, только журнал
        // ошибка во время запуска: даём странице 3 с — если экран ввода кода всё-таки заработал, сообщение не нужно
        if (!hint && !B._now) { setTimeout(function () { if (!B.ready) { B._now = true; B.fail(e, where); B._now = false; } }, 3000); return; }
        var d = document.getElementById('bootmsg');
        if (!d) { d = document.createElement('div'); d.id = 'bootmsg'; d.className = 'boot-msg'; (document.body || document.documentElement).appendChild(d); }
        d.innerHTML = '<div class="boot-box"><div style="font-size:54px">🦖</div><h2>Динопарк не запустился на этом экране</h2>' +
          '<p>' + (hint || 'Браузер телевизора не смог выполнить страницу.') + '</p>' +
          '<p class="boot-tip">Что попробовать: нажмите «Перезагрузить»; обновите ПО телевизора; откройте сайт в другом браузере на ТВ (например, Chrome или Яндекс Браузер на Android TV) — или подключите телефон к ТВ по HDMI / трансляции экрана.</p>' +
          '<button class="btn green" id="bootre">🔄 Перезагрузить</button>' +
          '<p class="boot-tech">Для поддержки: ' + String(rec.m).replace(/[<>&]/g, '') + (rec.w ? ' · ' + String(rec.w).replace(/[<>&]/g, '') : '') + ' · ' + B.mode + '<br>' + navigator.userAgent.replace(/[<>&]/g, '') + '</p></div>';
        var b = document.getElementById('bootre'); if (b) { b.onclick = function () { location.reload(); }; try { b.focus(); } catch (x) { /* */ } }
      };
      W.onerror = function (msg, src, line, col, err) { B.fail(err || msg, (src ? String(src).split('/').pop() : '') + (line ? ':' + line : '')); };
      if (W.addEventListener) W.addEventListener('unhandledrejection', function (ev) { B.log(ev && ev.reason, 'promise'); });
    })();
  </script>
  <style>
    /* без inset/gap — старые браузеры телевизоров (Chromium 68–86) */
    body { background: #04121a; background: radial-gradient(circle at 50% 30%, #0f3a3f, #04121a 70%); }
    .tv-join { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; overflow: auto; }
    .tv-join .panel { width: 640px; max-width: 100%; text-align: center; padding: 28px 30px; }
    .tv-join h1 { margin: 0 0 6px; font-size: 34px; font-weight: 900; }
    .tv-join .note { font-size: 19px; }
    .tv-join .field { text-align: center; font-size: 46px; letter-spacing: 14px; min-height: 84px; margin-top: 16px; width: 100%; box-sizing: border-box; }
    .tv-join .btn { font-size: 24px; min-height: 64px; }
    .tv-join .btn + .btn { margin-left: 12px; }
    .kp { display: flex; flex-wrap: wrap; justify-content: center; margin: 14px auto 4px; max-width: 420px; }
    .kp button { width: 30%; margin: 1.5%; height: 64px; font-size: 30px; font-weight: 900; border-radius: 16px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #fff; font-family: inherit; cursor: pointer; }
    .kp button:focus, .tv-join .btn:focus, .tv-join .field:focus { outline: 4px solid #ffd43b; outline-offset: 2px; }
    .kp button.ok { background: linear-gradient(180deg, #4be895, #1fae66); color: #04311b; }
    .tv-err { color: #ffb3b3; min-height: 26px; font-size: 20px !important; font-weight: 800; }
    .tv-bar { position: fixed; top: 14px; right: 14px; z-index: 6; display: flex; transition: opacity .5s; }
    .tv-bar .btn { margin-left: 8px; font-size: 18px; }
    .tv-bar.fade { opacity: 0; pointer-events: none; }
    .tv-name { position: fixed; left: 16px; bottom: 14px; z-index: 6; padding: 10px 16px; font-weight: 800; font-size: 20px; transition: opacity .5s; }
    .tv-name.fade { opacity: 0; }
    .tv-link { position: fixed; right: 68px; bottom: 14px; z-index: 6; padding: 8px 14px; font-weight: 800; font-size: 16px; }
    .tv-link.hidden { display: none; }
    .boot-msg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: #04121a; color: #fff; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; padding: 20px; overflow: auto; font-family: Nunito, Arial, sans-serif; }
    .boot-box { width: 760px; max-width: 100%; text-align: center; font-size: 22px; line-height: 1.4; }
    .boot-box h2 { font-size: 34px; margin: 6px 0 10px; }
    .boot-tip { color: #cfe; font-size: 19px; }
    .boot-tech { color: #8aa; font-size: 14px; margin-top: 18px; word-break: break-all; }
    .boot-box .btn { font-size: 26px; min-height: 64px; padding: 0 28px; }
    .boot-box .btn:focus { outline: 4px solid #ffd43b; outline-offset: 2px; }
  </style>
</head>
<body class="tv-page">
  <canvas id="park" class="park-canvas hidden" style="cursor:default"></canvas>
  <div class="tv-join" id="join">
    <div class="panel glass">
      <div style="font-size:56px">📺</div>
      <h1>Открыть парк на телевизоре</h1>
      <p class="note">На телефоне в парке нажмите <b>☰ → 📺 ТВ</b> и введите здесь код из пяти цифр. Регистрация не нужна.</p>
      <input class="field" id="code" maxlength="5" inputmode="numeric" pattern="[0-9]*" placeholder="• • • • •" autocomplete="off" autofocus>
      <div class="kp" id="kp"></div>
      <div class="btn-row" style="justify-content:center"><button class="btn green" id="go">Открыть</button></div>
      <p class="note tv-err" id="err"></p>
      <p class="note" id="mode"></p>
    </div>
  </div>
  <div class="tv-bar hidden" id="bar"><button class="btn" id="fs">⛶ Во весь экран</button><button class="btn" id="exit">✕ Отключить</button></div>
  <div class="tv-name glass hidden" id="tvname"></div>
  <div class="tv-link glass hidden" id="tvlink"></div>
  <div class="tv-toast glass" id="tvtoast"></div>

  <script>
    /* Выбор сборки: современная (ES2017, с 3D) или наследная ES5 (js/legacy, только 2D) для старых ТВ.
       ?legacy=1 — принудительно наследная (для проверки). */
    (function () {
      var B = window.DPBOOT, modern = true, list;
      var MODERN = ["js/util.js", "js/music.js", "js/store.js", "js/needs.js", "js/voices.js", "js/dinos.js", "js/backgrounds.js", "js/scene.js", "js/life.js", "js/creatures.js", "js/vendor/three.dino.min.js", "js/dino3d.js", "js/nature3d.js", "js/things3d.js", "js/scene3d.js", "js/config.js", "js/relay.js", "js/sync.js", "js/tv.js"];
      var LEGACY = ["js/legacy/tv-1.js", "js/config.js", "js/legacy/tv-2.js"];
      try { new Function('"use strict"; async function a() { await 0; } class K { m() { return `${1}`; } } let { x = 1 } = {}; const f = (...r) => r; for (const v of [1]) {}'); } catch (e) { modern = false; }
      if (!window.Promise || !window.Map || !window.WeakMap || !window.Symbol || !Object.assign || !Array.prototype.includes || !Object.entries || !window.TextEncoder) modern = false;
      if (/[?&]legacy=1/.test(location.search)) modern = false;
      B.mode = modern ? 'modern' : 'legacy';
      list = modern ? MODERN : LEGACY;
      var head = document.getElementsByTagName('head')[0], i, left = list.length, failed = false;
      for (i = 0; i < list.length; i++) (function (src) {
        var s = document.createElement('script'); s.src = src; s.async = false;
        s.onload = function () { left--; };
        s.onerror = function () { if (failed) return; failed = true; B.fail(new Error('не загрузился файл ' + src), 'сеть', 'Не удалось загрузить файлы сайта. Проверьте интернет на телевизоре и нажмите «Перезагрузить».'); };
        head.appendChild(s);
      })(list[i]);
      // сторож: если через 25 с экран ввода кода так и не заработал — показываем, что случилось, вместо пустой страницы
      setTimeout(function () { if (!B.ready && !failed) B.fail(new Error(left > 0 ? 'файлы ещё загружаются (' + left + ')' : 'скрипты не запустились'), 'сторож', left > 0 ? 'Сайт загружается слишком долго. Проверьте интернет на телевизоре и нажмите «Перезагрузить».' : 'Браузер телевизора не смог запустить страницу.'); }, 25000);
    })();
  </script>
  <noscript><div class="boot-msg"><div class="boot-box"><h2>Включите JavaScript</h2><p>Без JavaScript Динопарк не работает.</p></div></div></noscript>
</body>
</html>
