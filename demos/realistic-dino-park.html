<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — 3D Экосистема</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Назад в меню</a>
    <div id="canvas-container"></div>

    <!-- Подключаем Three.js из vendor -->
    <script src="../vendor/three.min.js"></script>
    <script>
        // Инициализация стабильной 3D сцены парка динозавров и системы трюков
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090d16);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Процедурные динозавры (базовые фигуры для стабильности работы)
        const geometry = new THREE.BoxGeometry(2, 2, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x22c55e });
        const dino = new THREE.Mesh(geometry, material);
        scene.add(dino);

        // Анимация и цикл рендеринга
        function animate() {
            requestAnimationFrame(animate);
            dino.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
