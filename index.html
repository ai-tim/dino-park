<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Главное меню</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 32px;
            border-radius: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.12);
        }
        h1 {
            color: #4ade80;
            font-size: 1.85rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
        .btn.secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: none;
        }

</head>
<body>
    <div class="container">
        <h1>🦖 Парк Динозавров</h1>
        <p>Раскрась рисунок на листе, сфотографируй телефоном — и доисторический мир оживет в 3D!</p>
        <a href="./demos/realistic-dino-park.html" class="btn">🚀 Открыть парк в 3D</a>

    </div>

</html>
