<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Дополненная реальность</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webcam-video, #canvas-output {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div>
            <h3 style="margin: 0 0 4px 0;">Парк Динозавров</h3>
            <p style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Наведите камеру на раскраску с метками</p>
        </div>
        <a href="control-panel.html" class="back-btn">Панель</a>
    </div>

    <!-- Видеопоток с камеры телефона -->
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="canvas-output" style="display:none;"></canvas>

    <!-- Контейнер для 3D-сцены Three.js поверх камеры -->
    <div id="canvas-container"></div>

    <!-- Подключаем Three.js и наш трекер -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../tools/marker-tracker.js"></script>
    <script>
        const videoElement = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('canvas-output');
        
        // Инициализация трекера камеры
        const tracker = new DinoMarkerTracker(videoElement, canvasElement);
        tracker.initCamera();

        // Настройка Three.js сцены поверх камеры
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Временный динозавр (заглушка на месте маркера)
        const geometry = new THREE.BoxGeometry(2, 2, 3);
        const material = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.3 });
        const dino = new THREE.Mesh(geometry, material);
        dino.position.set(0, 0, 0);
        scene.add(dino);

        function animate() {
            requestAnimationFrame(animate);
            dino.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
