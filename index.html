<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-container {
            text-align: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        p {
            margin: 0 0 25px 0;
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .menu-btn.action {
            background: #16a34a;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
        .menu-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-note {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="logo-icon">🦖</div>
        <h1>Парк Динозавров</h1>
        <p>Раскрась рисунок на листе, сфотографируй телефоном — и доисторический мир оживет в 3D!</p>
        
        <a href="demos/realistic-dino-park.html" class="menu-btn action">
            <span>🚀</span> Открыть парк в 3D (AR)
        </a>
        <a href="#" class="menu-btn" onclick="alert('Модуль сканирования и шаблонов раскраски'); return false;">
            <span>🎨</span> Скачать раскраску T-Rex
        </a>
        <a href="demos/control-panel.html" class="menu-btn secondary">
            <span>⚙️</span> Панель управления
        </a>
        
        <div class="footer-note">Интерактивный проект на GitHub Pages</div>
    </div>
</body>
</html>
