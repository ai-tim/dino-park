<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Живая Экосистема</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #7dd3fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 30px 20px; pointer-events: none;
        }

        .hero-banner {
            background: rgba(15, 23, 42, 0.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            padding: 14px 28px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); pointer-events: auto;
            max-width: 480px; width: 100%;
        }
        .hero-banner h1 { margin: 0 0 4px 0; font-size: 1.6rem; color: #ffffff; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .hero-banner p { margin: 0; color: #e2e8f0; font-size: 0.85rem; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }

        .menu-buttons-panel {
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 16px 20px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); display: flex; gap: 12px;
            width: 100%; max-width: 520px; pointer-events: auto; justify-content: center; flex-wrap: wrap;
        }
        .menu-btn {
            flex: 1; min-width: 140px; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 0.9rem;
            color: white; box-shadow: 0 6px 16px rgba(0,0,0,0.2); transition: transform 0.15s ease, background 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; text-align: center;
        }
        .menu-btn:active { transform: scale(0.96); }
        .menu-btn.primary { background: rgba(16, 185, 129, 0.65); }
        .menu-btn.primary:hover { background: rgba(16, 185, 129, 0.85); }
        .menu-btn.scanner { background: rgba(59, 130, 246, 0.65); }
        .menu-btn.scanner:hover { background: rgba(59, 130, 246, 0.85); }
        .menu-btn.tv { background: rgba(139, 92, 246, 0.65); }
        .menu-btn.tv:hover { background: rgba(139, 92, 246, 0.85); }

        .audio-control {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); color: white;
            padding: 10px 16px; border-radius: 14px; font-weight: bold; font-size: 0.85rem;
            cursor: pointer; pointer-events: auto; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <button class="audio-control" id="audioToggle" onclick="toggleParkMusic()">🎵 Музыка парка: Выкл</button>

    <div id="canvas-container"></div>

    <div class="menu-overlay">
        <div class="hero-banner">
            <h1>🦕 Парк Динозавров</h1>
            <p>Живая экосистема, дикая природа и творчество</p>
        </div>

        <div class="menu-buttons-panel">
            <a href="demos/realistic-dino-park.html" class="menu-btn primary">🌴 В Парк</a>
            <a href="demos/scanner.html" class="menu-btn scanner">🎨 Сканер</a>
            <a href="demos/realistic-dino-park.html?tv=1" class="menu-btn tv">📺 ТВ Режим</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Аудио-синтезатор сказочной мелодии
        let audioCtx = null;
        let isMusicPlaying = false;
        let melodyInterval = null;

        function toggleParkMusic() {
            const btn = document.getElementById('audioToggle');
            if (!isMusicPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isMusicPlaying = true;
                btn.innerText = "🎵 Музыка парка: Вкл";
                startCuteMelody();
            } else {
                isMusicPlaying = false;
                if (melodyInterval) clearInterval(melodyInterval);
                if (audioCtx) audioCtx.close();
                btn.innerText = "🎵 Музыка парка: Выкл";
            }
        }

        function playNote(freq, duration) {
            if (!audioCtx || !isMusicPlaying) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startCuteMelody() {
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
            melodyInterval = setInterval(() => {
                if (!isMusicPlaying) return;
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                playNote(randomNote, 1.2);
            }, 800);
        }

        // 3D Сцена
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.012);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 6, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
        sunLight.position.set(20, 30, 20);
        scene.add(sunLight);

        // Поляна
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        scene.add(ground);

        // Деревья
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.5, 2, 6),
                new THREE.MeshStandardMaterial({ color: 0x78350f })
            );
            trunk.position.y = -1;
            treeGroup.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(2, 4, 6),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.7 })
            );
            leaves.position.y = 1.2;
            treeGroup.add(leaves);

            treeGroup.position.set(x, -2, z);
            scene.add(treeGroup);
        }

        for (let i = 0; i < 14; i++) {
            const angle = (i / 14) * Math.PI * 2;
            const dist = 12 + Math.random() * 8;
            createTree(Math.cos(angle) * dist, Math.sin(angle) * dist - 4);
        }

        // Птеродактиль с пикированием
        const flyerGroup = new THREE.Group();
        const flyerMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3 });
        flyerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.8), flyerMat));
        const flyerHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), flyerMat);
        flyerHead.position.set(0, 0.2, 1.1);
        flyerGroup.add(flyerHead);

        const wingGeo = new THREE.BufferGeometry();
        wingGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
            0, 0, 0,   0, 0, 1.2,   3.5, 0, -0.8,
            0, 0, 0,   0, 0, 1.2,  -3.5, 0, -0.8
        ]), 3));
        flyerGroup.add(new THREE.Mesh(wingGeo, flyerMat));
        scene.add(flyerGroup);

        // Умные динозавры с естественной медленной поступью и поведением
        function createSmartDino(colorHex, startX, startZ) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.6, 3.4), bodyMat);
            body.position.y = 0.8;
            group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 1.1), bodyMat);
            head.position.set(0, 1.6, 2);
            group.add(head);

            const tail = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.5, 4), bodyMat);
            tail.rotation.x = Math.PI / 2;
            tail.position.set(0, 0.9, -2.6);
            group.add(tail);

            const legGeo = new THREE.BoxGeometry(0.4, 1.4, 0.4);
            ['FL', 'FR', 'BL', 'BR'].forEach((pos, idx) => {
                const leg = new THREE.Mesh(legGeo, bodyMat);
                leg.position.set((idx % 2 === 0 ? 0.8 : -0.8), -0.2, (idx < 2 ? 1 : -1));
                group.add(leg);
            });

            group.position.set(startX, -2, startZ);
            scene.add(group);

            return {
                mesh: group,
                targetX: startX,
                targetZ: startZ,
                speed: 0.005 + Math.random() * 0.003, // Очень спокойная, естественная скорость
                state: 'grazing', // 'grazing' (ест/стоит) или 'walking' (идет)
                timer: 3 + Math.random() * 3
            };
        }

        const smartDinosaurs = [
            createSmartDino(0x059669, -4, -2),
            createSmartDino(0xd97706, 4, -5),
            createSmartDino(0xdb2777, -5, 4)
        ];

        function updateEcosystem(time) {
            // Экосистема динозавров: медленная ходьба, щипание травы, паузы
            smartDinosaurs.forEach((dino, idx) => {
                dino.timer -= 0.016;
                if (dino.state === 'grazing') {
                    // Во время еды/отдыха слегка покачиваем голову (имитация пощипывания)
                    dino.mesh.position.y = -2 + Math.sin(time * 3 + idx) * 0.03;
                    if (dino.timer <= 0) {
                        dino.targetX = (Math.random() - 0.5) * 14;
                        dino.targetZ = (Math.random() - 0.5) * 10 - 3;
                        dino.state = 'walking';
                        dino.timer = 8 + Math.random() * 6; // идет дольше
                    }
                } else {
                    const dx = dino.targetX - dino.mesh.position.x;
                    const dz = dino.targetZ - dino.mesh.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < 0.4 || dino.timer <= 0) {
                        dino.state = 'grazing';
                        dino.timer = 4 + Math.random() * 4;
                    } else {
                        const targetAngle = Math.atan2(dx, dz);
                        let angleDiff = targetAngle - dino.mesh.rotation.y;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        dino.mesh.rotation.y += angleDiff * 0.03;

                        // Медленный, тяжелый шаг
                        dino.mesh.position.x += Math.sin(dino.mesh.rotation.y) * dino.speed * 12;
                        dino.mesh.position.z += Math.cos(dino.mesh.rotation.y) * dino.speed * 12;
                        dino.mesh.position.y = -2 + Math.abs(Math.sin(time * 4 + idx)) * 0.08;
                    }
                }
            });

            // Птеродактиль: круговой полет с красивыми пике к деревьям
            const flyerAngle = time * 0.4;
            const radius = 10;
            flyerGroup.position.x = Math.cos(flyerAngle) * radius;
            flyerGroup.position.z = Math.sin(flyerAngle) * radius - 4;
            
            // Волнообразная высота с резкими пике вниз и взмыванием вверх
            flyerGroup.position.y = 8 + Math.sin(time * 0.8) * 4; 
            
            // Наклон корпуса при пике
            flyerGroup.rotation.x = Math.cos(time * 0.8) * 0.4;
            flyerGroup.rotation.y = -flyerAngle - Math.PI / 2;
            flyerGroup.rotation.z = Math.sin(time * 4) * 0.2;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            updateEcosystem(time);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
