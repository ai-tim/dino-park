<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Все обитатели и кормление</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .feed-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .feed-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .feed-btn.meat {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div>
            <h3 style="margin: 0 0 4px 0;">Парк Динозавров</h3>
            <p id="action-status" style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Полная экосистема активна</p>
        </div>
        <a href="control-panel.html" class="back-btn">Панель</a>
    </div>

    <div class="feed-panel">
        <button class="feed-btn meat" onclick="feedDinos('meat')">🥩 Бросить мясо</button>
        <button class="feed-btn" onclick="feedDinos('plants')">🌿 Бросить папоротник</button>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                document.getElementById('webcam-video').srcObject = stream;
            } catch (e) {
                console.log('Камера недоступна');
            }
        }
        initCamera();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        dirLight.position.set(10, 25, 10);
        scene.add(dirLight);

        const parkGroup = new THREE.Group();

        // 1. T-Rex (Хищник с головой, хвостом и гребнем)
        function createTRex() {
            const trex = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, 2.2), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 }));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 1.0), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.3 }));
            head.position.set(0, 0.9, 1.0);
            const crest = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }));
            crest.position.set(0, 0.8, -0.2);
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 2.0), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.3 }));
            tail.position.set(0, 0.2, -1.7);
            trex.add(body, head, crest, tail);
            trex.position.set(-4, 0, 0);
            return trex;
        }

        // 2. Трицератопс (Травоядное с воротником)
        function createTriceratops() {
            const triceratops = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.4), new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.3 }));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.9), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.3 }));
            head.position.set(0, 0.3, 1.3);
            const shield = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 0.2), new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.3 }));
            shield.position.set(0, 0.5, 0.9);
            triceratops.add(body, head, shield);
            triceratops.position.set(-1.3, 0, 0);
            return triceratops;
        }

        // 3. Птеродактиль (Летающий)
        function createPterodactyl() {
            const pterodactyl = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 1.4), new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.3 }));
            const wing1 = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3 }));
            wing1.position.set(-1.2, 0.1, 0);
            const wing2 = wing1.clone();
            wing2.position.x = 1.2;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), new THREE.MeshStandardMaterial({ color: 0x7e22ce, roughness: 0.3 }));
            head.position.set(0, 0.3, 0.9);
            pterodactyl.add(body, wing1, wing2, head);
            pterodactyl.position.set(1.5, 2.5, 0);
            return pterodactyl;
        }

        // 4. Брахиозавр (Синий гигант с длинной шеей)
        function createBrachiosaurus() {
            const brachiosaurus = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2.8), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 }));
            const neck = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.3 }));
            neck.position.set(0, 1.5, 1.0);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.3 }));
            head.position.set(0, 2.8, 1.2);
            brachiosaurus.add(body, neck, head);
            brachiosaurus.position.set(4, -0.2, 0);
            return brachiosaurus;
        }

        const tRex = createTRex();
        const triceratops = createTriceratops();
        const pterodactyl = createPterodactyl();
        const brachiosaurus = createBrachiosaurus();

        parkGroup.add(tRex, triceratops, pterodactyl, brachiosaurus);
        scene.add(parkGroup);

        // Управление кормлением
        let activeGroup = null;
        let feedTimer = 0;

        window.feedDinos = function(type) {
            const status = document.getElementById('action-status');
            if (type === 'meat') {
                status.innerText = 'Хищники (T-Rex) сбежались на мясо!';
                activeGroup = [tRex];
            } else {
                status.innerText = 'Травоядные лакомятся папоротником!';
                activeGroup = [triceratops, brachiosaurus]; // Теперь реагируют и зеленый, и синий!
            }
            feedTimer = 35;
        };

        function animate() {
            requestAnimationFrame(animate);
            parkGroup.rotation.y += 0.004;

            // Анимация покачивания для выбранной группы динозавров
            if (feedTimer > 0 && activeGroup) {
                activeGroup.forEach(dino => {
                    dino.rotation.z = Math.sin(feedTimer * 0.5) * 0.15;
                });
                feedTimer--;
            } else if (activeGroup) {
                activeGroup.forEach(dino => {
                    dino.rotation.z = 0;
                });
                activeGroup = null;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
