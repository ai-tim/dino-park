<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парк Динозавров — Все обитатели</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webcam-video, #canvas-output {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div>
            <h3 style="margin: 0 0 4px 0;">Парк Динозавров</h3>
            <p style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Все виды динозавров активны</p>
        </div>
        <a href="control-panel.html" class="back-btn">Панель</a>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="canvas-output" style="display:none;"></canvas>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../tools/marker-tracker.js"></script>
    <script>
        const videoElement = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('canvas-output');
        const tracker = new DinoMarkerTracker(videoElement, canvasElement);
        tracker.initCamera();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Создаем группу динозавров (хищники и травоядные)
        const dinosGroup = new THREE.Group();

        // 1. Хищники (красноватые оттенки)
        const tRexGeo = new THREE.BoxGeometry(1.5, 2.5, 3);
        const tRexMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
        const tRex = new THREE.Mesh(tRexGeo, tRexMat);
        tRex.position.set(-3, 0, 0);
        dinosGroup.add(tRex);

        const raptorGeo = new THREE.BoxGeometry(1, 1.2, 2);
        const raptorMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c });
        const raptor = new THREE.Mesh(raptorGeo, raptorMat);
        raptor.position.set(-1, -0.5, 2);
        dinosGroup.add(raptor);

        // 2. Травоядные (зелено-синие оттенки)
        const triceratopsGeo = new THREE.BoxGeometry(2, 1.5, 3);
        const triceratopsMat = new THREE.MeshStandardMaterial({ color: 0x16a34a });
        const triceratops = new THREE.Mesh(triceratopsGeo, triceratopsMat);
        triceratops.position.set(2, 0, 0);
        dinosGroup.add(triceratops);

        const brachiosaurusGeo = new THREE.BoxGeometry(1.5, 4, 2);
        const brachiosaurusMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
        const brachiosaurus = new THREE.Mesh(brachiosaurusGeo, brachiosaurusMat);
        brachiosaurus.position.set(4, 1, -2);
        dinosGroup.add(brachiosaurus);

        scene.add(dinosGroup);

        function animate() {
            requestAnimationFrame(animate);
            dinosGroup.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
